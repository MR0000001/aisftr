<template>
    <div class="slds-box slds-theme_shade">
        <template if:false={isFromCase}>
            <div if:true={isLoading} class="slds-is-relative">
                <lightning-spinner alternative-text="Loading..." variant="brand">
                </lightning-spinner>
            </div>
        </template>

        <div class="slds-m-around_small slds-align_absolute-center slds-text-heading_small">
            <p>{label.legalEntitiesTableTitle}</p>
        </div>

        <div class='slds-m-around_medium'>
            <lightning-input type="search" disabled={disableSearch} label='{label.searchByCompanyName}' onchange={handleSearch}>
            </lightning-input>
        </div>

        <div class="slds-m-around_small slds-align_absolute-center">
            <p>{label.legalEntitiesTableInfo}</p>
        </div>

        <div class="slds-m-top_large slds-m-bottom_large slds-m-left_medium slds-m-right_medium">
            <lightning-datatable
                aria-label={label.legalEntitiesTableName}
                data={recordsToDisplay}
                data-id="contactslist"
                columns={columns}
                key-field="id"
                wrap-text-max-lines="3"
                hide-checkbox-column
                onrowaction={handleRowAction}>
            </lightning-datatable>
        </div>
        
        <div class="slds-m-around_medium">
            <div class="slds-m-bottom_medium">
                <p>{label.genericPage} <b>{page}</b> {label.of} <b>{totalPages}</b></p>
            </div>

            <c-paginator-bottom variant="brand" onprevious={handlePrevious} onnext={handleNext} onfirst={handleFirst} onlast={handleLast} currentpage={page} totalrecords={totalRecordsCount} pagesize={pageSize}></c-paginator-bottom>
        </div>

        <div class="slds-m-around_medium">
            <div class="slds-m-around_small slds-align_absolute-center">
                <p>{label.searchSigeud}</p>
            </div>
            <div class="slds-align_absolute-center">
                <lightning-button label={label.searchSigeudButton} variant="brand" onclick={handleSigeudCallout} disabled={disableReintegrateButton}></lightning-button>
            </div>
        </div>
    </div>
</template>
