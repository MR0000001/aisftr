<template>
    <template if:true={spin}>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
    </template>
    <div class="slds-box">
        <lightning-input type="toggle" label={toggle} name="input1" value={bottomUp} onchange={handleToggle}
                         message-toggle-active="" message-toggle-inactive="" checked={bottomUp}></lightning-input>
    </div>
    <lightning-accordion allow-multiple-sections-open active-section-name={activeSections} class="accordionMinHeight">
        <lightning-accordion-section name="caseDetails" label={label.caseDetails} class="title">
            <div class="slds-grid slds-gutters">
                <div class="slds-col">
                    <template if:false={bottomUp}>
                        <c-custom-lookup allrecords={allRecords} clabel={label.themArea}
                                         onselectedrec={handleSelectThemArea} selectedrecord={selectedThematicArea}
                                         synonym-map={synonymMap} dont-show-remove={dontShowRemoveThemArea} disable={InstructorUser}>
                        </c-custom-lookup>
                        <c-custom-lookup allrecords={allArguments} clabel={label.argument}
                                         onselectedrec={handleSelectArgument} selectedrecord={selectedArgument} data-lwcid="argument"
                                         dont-show-remove={dontShowRemoveArgument} disable={disableArgument}
                                         synonym-map={synonymMap}>
                        </c-custom-lookup>
                        <c-custom-lookup allrecords={allSpecifications} clabel={label.specific}
                                         onselectedrec={handleSelectSpecific} selectedrecord={selectedSpecific} data-lwcid="specific"
                                         dont-show-remove={dontShowRemoveSpecific} disable={disableSpecific}
                                         synonym-map={synonymMap}>
                        </c-custom-lookup>
                    </template>
                    <template if:true={bottomUp}>
                        <c-custom-lookup allrecords={allRecords} clabel={label.specific}
                                         onselectedrec={handleSelectSpecific} selectedrecord={selectedSpecific}
                                         synonym-map={synonymMap} disable={InstructorUser} dont-show-remove={dontShowRemoveSpecific}>
                        </c-custom-lookup>
                        <c-custom-lookup allrecords={allArguments} clabel={label.argument}
                                         onselectedrec={handleSelectArgument} selectedrecord={selectedArgument} data-lwcid="argument"
                                         dont-show-remove={dontShowRemoveArgument} disable={disableArgument} synonym-map={synonymMap}
                                         bottom-up={bottomUp}>
                        </c-custom-lookup>
                        <c-custom-lookup allrecords={allThemAreas} clabel={label.themArea}
                                         onselectedrec={handleSelectThemArea} selectedrecord={selectedThematicArea}
                                         data-lwcid="themarea" synonym-map={synonymMap} dont-show-remove={dontShowRemoveThemArea}
                                         disable={disableThematicArea} bottom-up={bottomUp}>
                        </c-custom-lookup>
                    </template>
                    <template if:true={showGeoCoding}>
                        <lightning-accordion active-section-name="geoCoding" allow-multiple-sections-open>
                            <lightning-accordion-section name="geoCoding" label={label.geoCoding} class="title">
                                <div class="slds-grid slds-gutters">
                                    <div class="slds-col">
                                        <lightning-input required type="text" label={label.address} value={fullAddress}
                                                         onchange={handleAddress} class="slds-m-bottom_x-small" disabled=true style="margin-bottom: 0px;"></lightning-input>
                                    </div>
                                    <div class="slds-col" style="display: flex;align-items: flex-end;">
                                        <lightning-icon icon-name="standard:address" alternative-text="Address"
                                                        title="Address" onclick={handleGMap} disabled={InstructorUser}>
                                        </lightning-icon>
                                    </div>
                                </div>
                                <template if:true={showMap}>
                                    <lightning-map  style="width: 20%; height: 20%; margin-top: 1%"
                                                    map-markers={mapMarkers} 
                                                    markers-title={address}
                                                    zoom-level={zoomLevel}
                                                    options={mapOptions}>
                                    </lightning-map>

                                </template>
                            </lightning-accordion-section>
                        </lightning-accordion>
                    </template>
                </div>
                <div class="slds-col colDropbox">

                    <lightning-combobox name={label.extimatedQueue} class="value" label={label.extimatedQueue}
                                        value={estimatedQueue} onchange={handleEstimatedQueueSelection} disabled={disableQueue}
                                        options={estimatedQueuePicklist} required></lightning-combobox>
                </div>
            </div>
            <!--<lightning-input type="text" label={label.extimatedQueue} disabled value={estimatedQueue}></lightning-input>-->
        </lightning-accordion-section>
    </lightning-accordion>

    <div class="slds-grid slds-gutters slds-m-around_xx-small">
        <div class="slds-col_bump-right">
            <template if:false={isCreation}>
                <lightning-button variant="destructive-text" label={label.cancel} title={label.cancel}
                                  onclick={handleCancel} class="slds-m-left_x-small" disabled={disableAll}></lightning-button>
            </template>
        </div>
        <div class="slds-grid slds-col_bump-left">
            <div class="slds-col">
                <lightning-button variant="destructive" label={label.previous} title={label.previous}
                                  onclick={handlePrevious} class="slds-m-left_x-small" disabled={disableAll}></lightning-button>
            </div>
            <div class="slds-col">
                <lightning-button variant="destructive" label={label.next} title={label.next} onclick={handleNext}
                                  class="slds-m-left_x-small" disabled={disableAll}></lightning-button>
            </div>
        </div>
    </div>
</template>
