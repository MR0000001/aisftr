  <template if:true={isModalOpenContact}>
    <!-- Modal/Popup Box LWC starts here -->
    <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
        <div class="slds-modal__container">
            <!-- Modal/Popup Box LWC header here -->
            <header class="slds-modal__header">
                <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModalContact}>
                    <lightning-icon icon-name="utility:close"
                        alternative-text="close"
                        variant="inverse"
                        size="small" ></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">{label.createNewContactHeader}</h2>
            </header>
            <!-- Modal/Popup Box LWC body starts here -->
            <div class="slds-modal__content slds-p-around_medium modalBody" id="modal-content-id-1">
              <template if:true={spinnerControlModal}>
                  <lightning-spinner alternative-text="Loading" size="medium"></lightning-spinner>
              </template>
              <lightning-input type="text" name = "FirstName" label={label.firstNameCont} onchange={handleChange} required></lightning-input> 
              <lightning-input type="text" name = "LastName" label={label.lastNameCont} onchange={handleChange} required></lightning-input> 
              <lightning-input type="text" name = "Email" label={label.emailCont} onchange={handleChange} required></lightning-input> 
              <lightning-combobox type="text" name = "XC_TypeOfContact__c" label={label.typeOfCont} onchange={handleChange} options={typeOfContactOpt} required></lightning-combobox> 
              <lightning-combobox type="text"  name = "XC_PhonePrefix__c" label={label.primaryPhonePrefixCont} onchange={handleChange} options={primaryPhonePrefixOpt} ></lightning-combobox>
              <lightning-input type="text" name = "XC_ContactPhone__c" label={label.primaryPhoneCont} onchange={handleChange} ></lightning-input>
              <lightning-input type="toggle" class="classToggle" name = "XC_PrimaryContact__c" label={label.primaryCont} onchange={handleChangeToggle} message-toggle-active = "" message-toggle-inactive = ""></lightning-input>
              <lightning-combobox type="text" name = "XC_ContactDocumentCountry__c" label={label.documentCountryCont} onchange={handleChangeCountry} options={documentCountryOpt} required></lightning-combobox>
              <lightning-combobox type="text" name = "XC_DocumentType__c" label={label.documentTypeCont} onchange={handleChange} options={documentTypeOpt} required disabled ={dependentDisabled}></lightning-combobox>
              <lightning-input type="text" name = "XC_ContactDocumentNumber__c" label={label.documentNumberCont} onchange={handleChange} required></lightning-input> 
              <lightning-input type="toggle" class="classToggle" name = "XC_MainDocument__c" label={label.mainDocCont} onchange={handleChangeToggle} message-toggle-active = "" message-toggle-inactive = ""></lightning-input>
              <lightning-input type="toggle" class="classToggle" name = "XC_GiveDataTo__c" label={label.giveDataToCont} onchange={handleChangeToggle} message-toggle-active = "" message-toggle-inactive = ""></lightning-input> 
              <lightning-input type="toggle" class="classToggle" name = "XC_GiveDataToThirdParties__c" label={label.giveDataToThirdCont} onchange={handleChangeToggle} message-toggle-active = "" message-toggle-inactive = ""></lightning-input> 
              <lightning-combobox label ={label.mainLegalEntityCont}  name = "XC_MainLegalEntity__c"  onchange={handleChange} options={legalEntityOpt} dropdown-alignment ="auto" required></lightning-combobox> 

            </div>

            <!-- Modal/Popup Box LWC footer starts here -->
            <footer class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={closeModalContact} title="Cancel">{label.cancelButtonLabel}</button>
                <button class="slds-button slds-button_brand" onclick={submitDetailsContact} title="OK">OK</button>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open"></div>
</template>

          </section>
          <div class="slds-backdrop slds-backdrop_open"></div>
        </template>

        <template if:true={showModalSkill}>
          <!-- Modal/Popup Box LWC starts here -->
          <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
              <div class="slds-modal__container">
                  <!-- Modal/Popup Box LWC header here -->
                  <header class="slds-modal__header">
                      <h2 id="modal-heading-06" class="slds-text-heading_medium slds-hyphenate">{label.skillHeader}</h2>
                  </header>
                  <!-- Modal/Popup Box LWC body starts here -->
                  <div class="slds-modal__content slds-p-around_medium modalBody" id="modal-content-id-6">
                    <lightning-accordion
                    allow-multiple-sections-open
                    active-section-name={activeSections}>
                    <template for:each={serviceResourceListSkill} for:item="map" for:index="index">
                      <lightning-accordion-section name={map.serviceResource.Name} label={map.serviceResource.Name} key={map.serviceResource.Name} class="accordian-class">
                        <lightning-dual-listbox name={map.serviceResource.Name}
                        label={label.selectSkillLabel}
                        source-label={label.availableLabel}
                        selected-label={label.selectedLabel}
                        options={skillNameList}
                        value={map.selectedSkills}
                        required-options={map.requiredSkills}
                        onchange={handleChangeSkill}></lightning-dual-listbox>
                      </lightning-accordion-section>
                    </template>
                  </lightning-accordion>
                  </div>
        
                  <!-- Modal/Popup Box LWC footer starts here -->
                  <footer class="slds-modal__footer">
                    <button class="slds-button slds-button_neutral" onclick={skipStep} title="Skip">Skip</button>
                    <button class="slds-button slds-button_brand" onclick={serviceResourceDetailSkillSubmit} title="OK">OK</button>
                  </footer>
              </div>
          </section>
          <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
          <template if:true={notLoaded}>
            <div class="exampleHolder">
              <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
          </template>
        </lightning-card> 
</template>
</template>
