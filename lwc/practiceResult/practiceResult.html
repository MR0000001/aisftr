        <p class="slds-m-vertical_medium content slds-m-around_medium">{label.practiceCodeIndicated}: <b> {practiceCodeIndicated}</b> </p>
    <div class="slds-m-around_medium">
        
                <c-paginator-bottom onprevious={handlePrevious} onnext={handleNext} onfirst={handleFirst}

                  </div>
                <c-practices-list currentpage={page} totalpages={totalpages} pagesize={pagesize} practices ={PaginationList}></c-practices-list>
