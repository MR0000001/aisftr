<template>
    <div class="slds-box slds-theme_shade">
        <div if:true={loading}>
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </div>
        <div if:false={errorToDisplay}>
            <div class="slds-p-around_medium">
                <lightning-icon icon-name="action:filter" size="x-small" alternative-text={label.filters}></lightning-icon>
                <span class="slds-p-left_x-small slds-text-title_caps">{label.filters}:</span>
                <lightning-layout multiple-rows>
                    <lightning-layout-item size="3" padding="around-small">
                        <lightning-input data-name="fromDateCmp" class="DateFilters" type="date" date-style="short" name="from" label={label.dateFrom} min={minDateCmp} max={maxDateCmp} onchange={handleFromDateChange} disabled={isFromDateDisabled}></lightning-input>
                    </lightning-layout-item>
                    <lightning-layout-item size="3" padding="around-small">
                        <lightning-input data-name="toDateCmp" class="DateFilters" type="date" date-style="short" name="to" label={label.dateTo} min={minDateCmp} max={maxDateCmp} onchange={handleToDateChange} disabled={isToDateDisabled}></lightning-input>
                    </lightning-layout-item>
                </lightning-layout>
                <div class="slds-clearfix slds-p-right_small">
                    <div class="slds-float_right">
                        <lightning-button variant="brand" label={label.search} onclick={handleSearch} disabled={isSearchDisabled} class="slds-m-left_x-small"></lightning-button>
                        <lightning-button variant="brand" label={label.reset} onclick={handleReset} disabled={isResetDisabled} class="slds-m-left_x-small"></lightning-button>
                    </div>
                </div>
            </div>

            <div class="slds-m-around_medium" style="background-color: white;">
                <p class="slds-p-around_x-small"><strong>{label.licencePlate}: </strong>{licencePlate}</p>
                <p class="slds-p-around_x-small"><strong>{label.vehicleModel}: </strong>{vehicleModel}</p>
            </div>
    
            <div class="slds-p-around_medium">
                <lightning-datatable    key-field="idRimozione"
                                        columns={columns}
                                        data={vehicleHistoryToDisplay}
                                        hide-checkbox-column 
                                        show-row-number-column >
                </lightning-datatable>
            </div>
    
            <div class="slds-m-top_small" if:true={vehicleHistoryFiltered.length}>
                <c-paginator records={vehicleHistoryFiltered} page-size={pageSize} total-records-count={vehicleHistoryFiltered.length} total-pages={totalPages} onpagination={handlePagination}></c-paginator>
            </div>
        </div>

        <div if:true={errorToDisplay}>
            <p>{errorToDisplay}</p>
        </div>
    </div>
</template>
