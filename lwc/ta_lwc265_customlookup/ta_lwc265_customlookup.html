<template>
    <div class="slds-card">
        <div class={className}>
            <template if:true={label}>
                <p class="slds-form-element__label">
                    <template if:true={required}>
                        <span class="requiredAsterisk">*</span>
                    </template>
                    {label}
                </p>
            </template>
            <div class="slds-combobox_container" aria-expanded="true" aria-haspopup="listbox" role="combobox">
                <div class="slds-combobox slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open">
                    <!-- Search Input Box -->
                    <template if:false={showPill}>
                        <lightning-input onchange={searchRecords} onclick={showRecords} onblur={blurEvent} class="inputBox" type="search" autocomplete="off" variant="label-hidden" placeholder={placeholder}></lightning-input>
                        <div if:true={showSpinner}>
                            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                        </div>
                    </template>

                    <!-- Selected Value Pill -->
                    <div if:true={showPill}>
                        <lightning-pill label={selectedRecord.identifier} name={selectedRecord.value} onremove={removeItem}>
                        </lightning-pill>
                    </div>
                    
                    <!-- Dropdown List -->
                    <template if:true={showDropdown}>
                        <div class="slds-dropdown-trigger slds-dropdown-trigger_click slds-is-open slds-dropdown_length-5" > <!--FD 08/08/2022 - INC000091951624 - FIX-->
                            <ul class="slds-listbox slds-listbox_vertical recordListBox" >
                                <template if:false={message} >
                                    <template for:each={recordsList} for:item="rec">                                        
                                        <li key={rec.value} data-key={rec.value} class="slds-listbox__item eachItem slds-p-vertical_small" onmousedown={selectItem}>
                                            <div class="slds-media slds-listbox__option_entity">
                                                <span class="verticalAlign slds-truncate">
                                                    <h5><b>{rec.identifier}</b></h5>
                                                </span>
                                             </div>                                        
                                        </li>
                                    </template>
                                </template>
                                <template if:true={message} >
                                    <li class="slds-listbox__item">
                                        <span class="slds-media slds-listbox__option_entity">{message}</span>
                                    </li>
                                </template>
                            </ul>
                        </div>
                    </template>
                </div>
            </div>
        </div>
    </div>
        
</template>
