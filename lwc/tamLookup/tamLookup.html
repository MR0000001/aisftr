<!-- Custom Lookup Component -->
<template>
    <lightning-card variant="narrow">
        <div class="slds-var-m-around_small">
            <c-tam-lookup-component
                    onlookup={handleLookup}
                    obj-name={strObjectName}
                    search-clause={strSearchClause}
                    display-fields={strDisplayFields}
                    fields = {fields}
                    show-label=true
                    label-name={strLabel}
                    value-id={strRecordId}
                    value-name={strRecordName}>
            </c-tam-lookup-component>
        </div>
    </lightning-card>
</template>
