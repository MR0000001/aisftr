<template>
  <!--
    <lightning-record-form
        record-id={caseid}
        object-api-name="Case"
        fields={fields}
        columns="2"
        mode="edit"
        onsuccess={handleSuccess}>
</lightning-record-form>
-->
  <lightning-record-edit-form
    object-api-name="Case"
    record-id={caseid}
    onsubmit={handleSubmit}
    onsuccess={handleSuccess}
    onerror={handleError}
  >
    <!-- <lightning-messages> </lightning-messages> -->
    <div class="slds-grid">
      <div class="slds-col slds-size_1-of-2">
        <template for:each={fields} for:item="field">
          <template if:true={field.isFirstColumn}>
            <template lwc:if={field.isSubjectPrePopulated}>
              <lightning-input-field
                field-name={field.fieldName}
                key={field}
                value={subject}
                onchange={handleSubjectChange}
                required
              ></lightning-input-field>
            </template>
            <template lwc:elseif={field.isCaseTag}>
              <lightning-combobox
                key={field}
                data-id={field.fieldName}
                label={caseTagLabel}
                variant="label-inline"
                value={caseTagValue}
                options={caseTagOptions}
                readonly={isCaseTagEmpty}
                required={field.isRequired}
              ></lightning-combobox>
            </template>
            <template lwc:else>
              <lightning-input-field
                field-name={field.fieldName}
                key={field}
                required={field.isRequired}
              ></lightning-input-field>
            </template>
          </template>
        </template>
      </div>
      <div class="slds-col slds-size_1-of-2">
        <template for:each={fields} for:item="field">
          <template lwc:if={field.isSecondColumn}>
            <lightning-input-field field-name={field.fieldName} key={field} required={field.isRequired}>
            </lightning-input-field>
          </template>
        </template>
      </div>
    </div>
    <div class="slds-grid slds-gutters">
      <template lwc:if={spin}>
        <lightning-spinner alternative-text="Loading"></lightning-spinner>
      </template>
      <div class="slds-col_bump-right">
        <template if:false={isCreation}>
          <lightning-button
            variant="destructive-text"
            label={label.cancel}
            title={label.cancel}
            onclick={handleCancel}
            disabled={disableAll}
            class="slds-var-m-left_x-small"
          ></lightning-button>
        </template>
      </div>
      <div class="slds-grid slds-col_bump-left">
        <div class="slds-col">
          <lightning-button
            variant="destructive"
            label={label.previous}
            title={label.previous}
            onclick={handlePrevious}
            disabled={disableAll}
            class="slds-var-m-left_x-small"
          ></lightning-button>
        </div>
        <div class="slds-col">
          <lightning-button
            class="slds-var-m-top_small"
            variant="destructive"
            type="submit"
            label={label.save}
          ></lightning-button>
        </div>
      </div>
    </div>
  </lightning-record-edit-form>
</template>
