<template>
    <div class="slds-m-around_large">
        <div if:true={isLoading} class="slds-is-relative">
            <lightning-spinner alternative-text="Loading..." variant="brand">
            </lightning-spinner>
        </div>
    </div>
 <div class="slds-p-bottom_medium">  
<lightning-card  title={label.tributesTitle} padding = "around-medium">
    <div style="
padding-top: 1%;padding-left: 1%
">
<lightning-input name="fiscalCode" type="text" label={label.fiscalCode} onchange = {handleFiscalCodeChange} maxlength="16" value={fiscalCodeIndicated} required></lightning-input>
    </div>
    <div style="padding-left: 1%"> 
        <lightning-combobox name="positions" label={label.positions} value={value}
            placeholder={label.choosePosition} onchange={handlePositionSelection} options={positions} required>
        </lightning-combobox>
    </div>
    <div style="padding-left: 1%">
        <lightning-combobox name="year" label={label.year} value={value}
            placeholder={label.chooseYear} onchange={handleYearSelection} options={years} required>
        </lightning-combobox>
    </div>
    <div style="padding-left: 1%">
        <lightning-combobox name="tributeTypology" label={label.tributeTypology} value={value}
            placeholder={label.chooseTributeTypology} onchange={handleTypologySelection} options={tributesTypologies} required>
        </lightning-combobox>
        
    </div>
    
    <div class="slds-card__footer">
        <lightning-button label={label.search} variant="brand" onclick={searchTributes} ></lightning-button>
    </div>
        
</lightning-card>
</div>
